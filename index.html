<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- цвет строки состояния: gray-50 и gray-900, как фон страницы в каждой теме -->
    <meta
      name="theme-color"
      content="#F9FAFB"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#101828"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Мои пары</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero" id="hero"></header>
      <nav class="week-nav" aria-label="Неделя">
        <div class="week-nav__heading">
          <h2 class="week-nav__title" id="range"></h2>
          <!-- «6 пар · 12 ак. ч» за открытую неделю; при 0 пар скрыта -->
          <p class="week-nav__summary" id="weekSummary" hidden></p>
        </div>
        <!-- группа ‹ Сегодня ›; иконки — Heroicons chevron-left/right, solid 20 -->
        <div class="week-nav__controls">
          <button
            class="week-nav__button week-nav__button--arrow"
            id="prev"
            aria-label="Предыдущая неделя"
          >
            <svg
              class="week-nav__icon"
              viewBox="0 0 20 20"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
          <button class="week-nav__button" id="tod">Сегодня</button>
          <button
            class="week-nav__button week-nav__button--arrow"
            id="next"
            aria-label="Следующая неделя"
          >
            <svg
              class="week-nav__icon"
              viewBox="0 0 20 20"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>
      </nav>
      <main id="week"></main>
      <p class="page__hint" id="hint">
        Нажми на пару, чтобы увидеть подробности. Удерживай, чтобы перенести.<br />Нажми
        на пустую клетку, чтобы добавить пару.
      </p>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <input type="file" id="file" accept="application/json,.json" hidden />
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
