<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- цвет строки состояния: gray-50 и gray-900, как фон страницы в каждой теме -->
    <meta
      name="theme-color"
      content="#F9FAFB"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#101828"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Мои пары</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero" id="hero"></header>
      <nav class="week-nav">
        <button
          class="week-nav__arrow"
          id="prev"
          aria-label="Предыдущая неделя"
        >
          ‹
        </button>
        <div class="week-nav__range">
          <span id="range"></span
          ><button class="week-nav__today" id="tod">К текущей неделе</button>
        </div>
        <button class="week-nav__arrow" id="next" aria-label="Следующая неделя">
          ›
        </button>
      </nav>
      <main id="week"></main>
      <p class="page__hint" id="hint">
        Нажми на пару, чтобы увидеть подробности. Удерживай, чтобы перенести.<br />Нажми
        на пустую клетку, чтобы добавить пару.
      </p>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <input type="file" id="file" accept="application/json,.json" hidden />
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
